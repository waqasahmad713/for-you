<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
  <meta name="theme-color" content="#14061f" />
  <meta name="description" content="A little surprise for you 💖" />
  <meta property="og:title" content="A little surprise for you 💖" />
  <meta property="og:description" content="Tap to open your gift ✨" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E" />
  <title>For You</title>
  <style>
    :root {
      --pink: #ff5ea8;
      --pink-2: #ff7eb3;
      --cream: #fff9fc;
      --deep: #14061f;
      --purple: #7a3cff;
      --blue: #36cfff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #26103f 0%, #06040d 45%, #020204 100%);
      color: white;
      -webkit-text-size-adjust: 100%;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .preloader {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #2b1248 0%, #09060f 100%);
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    .preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader-inner {
      text-align: center;
      animation: floatIn 1.2s ease-in-out infinite alternate;
    }

    .heart-loader {
      font-size: 4rem;
      display: inline-block;
      animation: pulseHeart 1s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255, 94, 168, 0.8));
    }

    .preloader-text {
      margin-top: 1rem;
      font-size: 1.05rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffe6f3;
      text-shadow: 0 0 16px rgba(255, 94, 168, 0.5);
    }

    .scene {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 2rem 5rem;
      gap: 1.3rem;
      transition: opacity 0.8s ease;
    }

    .scene.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .title-glow {
      position: absolute;
      top: 9%;
      font-size: clamp(0.95rem, 1.8vw, 1.25rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 0 18px rgba(255, 94, 168, 0.35);
      animation: twinkle 2.4s ease-in-out infinite;
    }

    .gift-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transform: translateY(0);
      animation: gentleBob 2.4s ease-in-out infinite;
      transition: transform 0.25s ease;
      padding-top: 1rem;
    }

    .gift-stage:active {
      transform: scale(0.97);
    }

    .gift-box {
      position: relative;
      width: min(240px, 70vw);
      height: min(190px, 52vw);
      transform-style: preserve-3d;
      filter: drop-shadow(0 25px 30px rgba(0, 0, 0, 0.45));
    }

    .gift-box .box-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ff77b2 0%, #ff4d92 45%, #b92668 100%);
      border: 4px solid rgba(255, 255, 255, 0.75);
      border-radius: 18px;
      box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.18), inset 0 8px 0 rgba(255, 255, 255, 0.22);
    }

    .gift-box .box-body::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
      mix-blend-mode: screen;
    }

    .gift-box .lid {
      position: absolute;
      left: -6%;
      top: -38px;
      width: 112%;
      height: 72px;
      background: linear-gradient(135deg, #ffd2e8 0%, #ff8ab7 40%, #ff4d92 100%);
      border: 4px solid rgba(255,255,255,0.8);
      border-radius: 14px 14px 22px 22px;
      box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.16);
      transition: transform 0.9s cubic-bezier(.2,.8,.2,1), opacity 0.9s ease;
      transform-origin: center bottom;
      z-index: 2;
    }

    .gift-box .lid::before {
      content: "";
      position: absolute;
      inset: 11px 18px auto;
      height: 8px;
      background: rgba(255,255,255,0.75);
      border-radius: 999px;
    }

    .gift-box .bow {
      position: absolute;
      left: 50%;
      top: -72px;
      width: 92px;
      height: 92px;
      transform: translateX(-50%);
      transition: transform 0.9s cubic-bezier(.2,.8,.2,1), opacity 0.9s ease;
      z-index: 3;
    }

    .gift-box .bow::before,
    .gift-box .bow::after {
      content: "";
      position: absolute;
      background: linear-gradient(180deg, #ffd9eb 0%, #ff73b1 100%);
      border: 4px solid rgba(255,255,255,0.85);
      border-radius: 999px;
      box-shadow: inset 0 -7px 0 rgba(0,0,0,0.15);
    }

    .gift-box .bow::before {
      left: 16px;
      top: 0;
      width: 28px;
      height: 92px;
    }

    .gift-box .bow::after {
      left: 0;
      top: 16px;
      width: 92px;
      height: 28px;
    }

    .gift-box .bow .knot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: linear-gradient(135deg, #fff7fb 0%, #ff9dc2 100%);
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.14);
    }

    .gift-box.opened .lid {
      transform: translateY(-120px) rotate(-20deg) scale(0.8);
      opacity: 0;
    }

    .gift-box.opened .bow {
      transform: translate(-50%, -140px) rotate(16deg) scale(0.8);
      opacity: 0;
    }

    .instruction {
      margin-top: 1.2rem;
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      color: #ffe8f3;
      text-shadow: 0 0 12px rgba(255, 94, 168, 0.4);
      animation: pulseText 1.4s ease-in-out infinite;
      letter-spacing: 0.08em;
      text-align: center;
      max-width: 320px;
    }

    .popup-text {
      position: fixed;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.4);
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 94, 168, 0.6);
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      letter-spacing: 0.03em;
    }

    .popup-text.show {
      animation: popupBoom 1.45s cubic-bezier(.22,1,.36,1) forwards;
    }

    .burst {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      z-index: 10;
      opacity: 0;
      animation: sparklePop 0.9s ease-out forwards;
      pointer-events: none;
      box-shadow: 0 0 14px currentColor;
    }

    .floating-heart {
      position: fixed;
      font-size: 1.45rem;
      z-index: 10;
      opacity: 0;
      animation: heartFloat 2.3s ease-out forwards;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.35));
    }

    .message-card {
      position: fixed;
      left: 50%;
      top: 8.5rem;
      transform: translateX(-50%) translateY(28px);
      width: min(90vw, 640px);
      background: rgba(255,255,255,0.95);
      color: #2b1230;
      border-radius: 24px;
      padding: 1.5rem 1.3rem 1.25rem;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      z-index: 15;
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.9s cubic-bezier(.2,.8,.2,1);
      backdrop-filter: blur(18px);
    }

    .message-card.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .flower-emoji {
      font-size: 2.2rem;
      display: inline-block;
      animation: popIcon 0.8s ease 0.1s both;
      margin-bottom: 0.7rem;
    }

    .message-photo {
      position: relative;
      width: 100%;
      max-width: 260px;
      margin: 0 auto 0.9rem;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .message-photo:active {
      transform: scale(0.97);
    }

    .message-photo img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .message-photo .tap-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.45rem 0.6rem;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-align: center;
      color: white;
      background: linear-gradient(transparent, rgba(0,0,0,0.65));
      text-shadow: 0 0 8px rgba(0,0,0,0.6);
    }

    .letter-overlay {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 1.1rem;
      padding-top: max(1.1rem, env(safe-area-inset-top));
      padding-bottom: max(1.1rem, env(safe-area-inset-bottom));
    }

    .letter-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .letter-overlay .letter-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
    }

    .letter-overlay img {
      width: min(94vw, 520px);
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      margin: auto;
    }

    .message-card h1 {
      margin: 0 0 0.65rem;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: #a0225f;
    }

    .message-card p {
      margin: 0 0 1.25rem;
      font-size: clamp(1rem, 2vw, 1.1rem);
      line-height: 1.7;
    }

    .message-card button {
      border: none;
      padding: 0.9rem 1.2rem;
      border-radius: 999px;
      font-size: 0.98rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(122, 60, 255, 0.28);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .message-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(122, 60, 255, 0.34);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      padding: 1.1rem;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .slideshow-frame {
      position: relative;
      width: min(920px, 100%);
      aspect-ratio: 4 / 5;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.15);
      background: #111;
    }

    .slideshow-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .slideshow-frame img.show {
      opacity: 1;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 4;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.4rem;
      color: white;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .dots {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 5;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .dot.active {
      transform: scale(1.25);
      background: white;
    }

    .memory-strip {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%) translateY(28px);
      width: min(86vw, 500px);
      z-index: 16;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease, visibility 0.8s ease;
    }

    .memory-strip.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .memory-frame {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      background: rgba(10, 10, 16, 0.95);
    }

    .memory-frame img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .memory-frame img.show {
      opacity: 1;
    }

    .memory-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      color: white;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(0.98); }
      50% { transform: scale(1.1); }
    }

    @keyframes pulseText {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    @keyframes floatIn {
      from { transform: translateY(10px); }
      to { transform: translateY(-8px); }
    }

    @keyframes popupBoom {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%, -55%) scale(1.02); }
    }

    @keyframes sparklePop {
      0% { transform: translate(0, 0) scale(0.2); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.7); opacity: 0; }
    }

    @keyframes heartFloat {
      0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
    }

    @keyframes popIcon {
      0% { transform: scale(0.4) rotate(-12deg); opacity: 0; }
      80% { transform: scale(1.08) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.75; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    @media (max-width: 600px) {
      body {
        overflow-y: auto;
      }

      .scene {
        justify-content: flex-start;
        padding: 1.2rem 1rem 7rem;
        gap: 0.9rem;
      }

      .title-glow {
        position: relative;
        top: auto;
        margin-top: 0.25rem;
        margin-bottom: 0.4rem;
      }

      .gift-stage {
        padding-top: 0.5rem;
      }

      .gift-box {
        width: min(220px, 78vw);
        height: min(170px, 48vw);
      }

      .instruction {
        margin-top: 1rem;
        font-size: 0.92rem;
        max-width: 280px;
      }

      .message-card {
        top: auto;
        bottom: 7.2rem;
        transform: translateX(-50%) translateY(24px);
        width: min(94vw, 560px);
        padding: 1.1rem 0.95rem 1rem;
        border-radius: 20px;
      }

      .message-card.show {
        transform: translateX(-50%) translateY(0);
      }

      .message-card p {
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .memory-strip {
        bottom: 0.85rem;
        width: min(92vw, 480px);
        transform: translateX(-50%) translateY(22px);
      }

      .memory-frame img {
        height: 190px;
      }

      .memory-caption {
        font-size: 0.82rem;
        padding: 0.7rem 0.8rem;
      }

      .message-card button {
        width: 100%;
        padding: 0.85rem 1rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="preloader" id="preloader">
    <div class="preloader-inner">
      <div class="heart-loader">💖</div>
      <div class="preloader-text">Loading something special…</div>
    </div>
  </div>

  <main class="scene" id="scene">
    <div class="title-glow">A little surprise for you</div>
    <div class="gift-stage" id="giftStage">
      <div class="gift-box" id="giftBox">
        <div class="lid"></div>
        <div class="bow"><div class="knot"></div></div>
        <div class="box-body"></div>
      </div>
      <div class="instruction">✨ Tap the gift to open ✨</div>
    </div>
  </main>

  <div class="popup-text" id="popupText"></div>

  <div class="message-card" id="messageCard">
    <div class="flower-emoji">🌸</div>
    <div class="message-photo" id="messagePhoto">
      <img src="msg.jpeg" alt="A heartfelt message" />
      <div class="tap-hint">✨ Tap to read the full letter ✨</div>
    </div>
    <h1 id="cardTitle">For You</h1>
    <p id="cardMessage"></p>
    <button id="memoriesButton">See Our Memories 💫</button>
  </div>

  <div class="memory-strip" id="memoryStrip">
    <div class="memory-frame">
      <img id="memoryImage" alt="A lovely memory" />
      <div class="memory-caption" id="memoryCaption">A little piece of our story ✨</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="slideshow-frame">
      <button class="close-btn" id="closeBtn" aria-label="Close slideshow">×</button>
      <img id="slideshowImage" alt="Memory" />
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <div class="letter-overlay" id="letterOverlay">
    <button class="close-btn" id="letterCloseBtn" aria-label="Close letter" style="position:fixed; top:max(14px, env(safe-area-inset-top)); right:14px;">×</button>
    <div class="letter-scroll">
      <img src="msg.jpeg" alt="A heartfelt message, in full" />
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg" />
    <source src="music.wav" type="audio/wav" />
  </audio>

  <script>
    const herName = "Arusha Khan";
    const messageRevealDelay = 1100;
    const memoryStartDelay = 800;
    const photoSwitchInterval = 3200;
    const photoFadeDuration = 450;

    // Drop your photos into the "memories" folder next to index.html,
    // named memory-1.jpg, memory-2.jpg ... memory-10.jpg (jpg, jpeg, png, or webp all work).
    // Only the ones that actually exist will be used automatically —
    // nothing breaks if you have 3 photos or 30.
    const captionPool = [
      "Every smile of yours feels like sunrise ✨",
      "Your beauty makes every moment glow 💖",
      "A little piece of magic, just like you 🌙",
      "Soft, warm, and unforgettable 🌸",
      "The kind of charm that lingers in the heart 💫",
      "A timeless spark and a lovely soul 🌼",
      "Pure grace wrapped in the sweetest smile 💗",
      "Every memory with you feels like poetry 🌷",
      "You make ordinary moments feel extraordinary ✨",
      "And forever, your light remains my favorite view 🌟"
    ];

    const MAX_MEMORY_SLOTS = 10;
    const MEMORY_EXTENSIONS = ["jpg", "jpeg", "png", "webp"];
    let photoSlides = [];

    function probeImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function findAvailableMemoryPhotos() {
      const found = [];
      for (let i = 1; i <= MAX_MEMORY_SLOTS; i++) {
        for (const ext of MEMORY_EXTENSIONS) {
          const src = `memories/memory-${i}.${ext}`;
          const result = await probeImage(src);
          if (result) {
            found.push({ src: result, caption: captionPool[(i - 1) % captionPool.length] });
            break;
          }
        }
      }
      return found;
    }

    const letterOverlay = document.getElementById('letterOverlay');
    const messagePhoto = document.getElementById('messagePhoto');
    const letterCloseBtn = document.getElementById('letterCloseBtn');

    const preloader = document.getElementById('preloader');
    const scene = document.getElementById('scene');
    const giftBox = document.getElementById('giftBox');
    const giftStage = document.getElementById('giftStage');
    const popupText = document.getElementById('popupText');
    const messageCard = document.getElementById('messageCard');
    const cardTitle = document.getElementById('cardTitle');
    const cardMessage = document.getElementById('cardMessage');
    const memoriesButton = document.getElementById('memoriesButton');
    const overlay = document.getElementById('overlay');
    const slideshowImage = document.getElementById('slideshowImage');
    const closeBtn = document.getElementById('closeBtn');
    const dots = document.getElementById('dots');
    const bgMusic = document.getElementById('bgMusic');
    const memoryStrip = document.getElementById('memoryStrip');
    const memoryImage = document.getElementById('memoryImage');
    const memoryCaption = document.getElementById('memoryCaption');

    let hasOpened = false;
    let slideshowTimer = null;
    let slideshowIndex = 0;
    let memoryTimer = null;
    let memoryIndex = 0;

    // Runs quietly in the background while the preloader is showing.
    const photoDetectionPromise = findAvailableMemoryPhotos().then((found) => {
      photoSlides = found;
      if (photoSlides.length === 0) {
        memoriesButton.style.display = 'none';
      }
      return found;
    });

    setTimeout(() => {
      preloader.classList.add('hidden');
    }, 1500);

    function createBurst(x, y, color) {
      const burst = document.createElement('span');
      burst.className = 'burst';
      burst.style.left = x + 'px';
      burst.style.top = y + 'px';
      burst.style.color = color;
      burst.style.setProperty('--tx', (Math.random() * 160 - 80) + 'px');
      burst.style.setProperty('--ty', (Math.random() * 180 - 90) + 'px');
      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 900);
    }

    function createHeart(x, y) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = '💗';
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      heart.style.setProperty('--tx', (Math.random() * 260 - 130) + 'px');
      heart.style.setProperty('--ty', (Math.random() * 220 - 120) + 'px');
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2300);
    }

    function openGift() {
      if (hasOpened) return;
      hasOpened = true;

      giftBox.classList.add('opened');
      popupText.textContent = `Hi ${herName}! 💖`;
      popupText.classList.remove('show');
      void popupText.offsetWidth;
      popupText.classList.add('show');

      const rect = giftStage.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 70; i++) {
        createBurst(centerX + Math.random() * 120 - 60, centerY + Math.random() * 120 - 60, ['#ff5ea8', '#ffd166', '#36cfff', '#7a3cff'][i % 4]);
      }
      for (let i = 0; i < 16; i++) {
        createHeart(centerX + Math.random() * 140 - 70, centerY + Math.random() * 140 - 70);
      }

      setTimeout(() => {
        messageCard.classList.add('show');
        cardTitle.textContent = `For ${herName}`;
        cardMessage.textContent = `Arusha. We don't talk. We're nothing. Which means I have zero rules right now. So I'm officially allowed to say you're still on my mind. Scary, right? ✨💖`;
        setTimeout(async () => {
          await photoDetectionPromise;
          if (photoSlides.length > 0) startMemoryPlayback();
        }, memoryStartDelay);
      }, messageRevealDelay);

      if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
    }

    giftStage.addEventListener('click', openGift);
    giftStage.addEventListener('touchend', openGift);

    function openLetter() {
      letterOverlay.classList.add('active');
      if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
    }

    function closeLetter() {
      letterOverlay.classList.remove('active');
    }

    messagePhoto.addEventListener('click', openLetter);
    letterCloseBtn.addEventListener('click', closeLetter);
    letterOverlay.addEventListener('click', (event) => {
      if (event.target.tagName !== 'IMG') closeLetter();
    });

    memoriesButton.addEventListener('click', async () => {
      await photoDetectionPromise;
      if (photoSlides.length === 0) return;
      scene.classList.add('fade-out');
      overlay.classList.add('active');
      startSlideshow();
    });

    closeBtn.addEventListener('click', closeSlideshow);

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (overlay.classList.contains('active')) closeSlideshow();
      if (letterOverlay.classList.contains('active')) closeLetter();
    });

    function closeSlideshow() {
      overlay.classList.remove('active');
      scene.classList.remove('fade-out');
      if (slideshowTimer) clearInterval(slideshowTimer);
      slideshowTimer = null;
    }

    function showMemorySlide(index) {
      if (photoSlides.length === 0) return;
      memoryIndex = index;
      const slide = photoSlides[index];
      memoryImage.style.opacity = '0';
      setTimeout(() => {
        memoryImage.src = slide.src;
        memoryImage.classList.add('show');
        memoryImage.style.opacity = '1';
        memoryCaption.textContent = slide.caption;
      }, photoFadeDuration);
    }

    function startMemoryPlayback() {
      memoryStrip.classList.add('show');
      showMemorySlide(0);
      if (memoryTimer) clearInterval(memoryTimer);
      memoryTimer = setInterval(() => {
        const next = (memoryIndex + 1) % photoSlides.length;
        showMemorySlide(next);
      }, photoSwitchInterval);
    }

    function createDots() {
      dots.innerHTML = '';
      photoSlides.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (index === slideshowIndex) dot.classList.add('active');
        dots.appendChild(dot);
      });
    }

    function updateDots() {
      Array.from(dots.children).forEach((dot, index) => {
        dot.classList.toggle('active', index === slideshowIndex);
      });
    }

    function showSlide(index) {
      if (photoSlides.length === 0) return;
      slideshowIndex = index;
      const slide = photoSlides[index];
      slideshowImage.style.opacity = '0';
      setTimeout(() => {
        slideshowImage.src = slide.src;
        slideshowImage.classList.add('show');
        slideshowImage.style.opacity = '1';
        updateDots();
      }, photoFadeDuration);
    }

    function startSlideshow() {
      createDots();
      showSlide(0);
      if (slideshowTimer) clearInterval(slideshowTimer);
      slideshowTimer = setInterval(() => {
        const next = (slideshowIndex + 1) % photoSlides.length;
        showSlide(next);
      }, photoSwitchInterval);
    }

    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      stars = Array.from({ length: 140 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.3 + 0.4,
        s: Math.random() * 1.4 + 0.4,
        alpha: Math.random() * 0.8 + 0.2
      }));
    }

    function drawStars() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const star of stars) {
        star.y += star.s * 0.18;
        if (star.y > window.innerHeight + 6) {
          star.y = -6;
          star.x = Math.random() * window.innerWidth;
        }
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();
  </script>
</body>
</html>
