<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#14061f" />
    <meta name="description" content="A little surprise for you 💖" />
    <meta property="og:title" content="A little surprise for you 💖" />
    <meta property="og:description" content="Tap to open your gift ✨" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E" />
    <title>For You 💖</title>
    <style>
        :root {
            --pink: #ff5ea8;
            --pink-2: #ff7eb3;
            --cream: #fff9fc;
            --deep: #14061f;
            --purple: #7a3cff;
            --blue: #36cfff;
            --gold: #ffd166;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #26103f 0%, #06040d 45%, #020204 100%);
            color: white;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            position: fixed;
            inset: 0;
        }

        canvas#stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .preloader {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #2b1248 0%, #09060f 100%);
            transition: opacity 0.9s ease, visibility 0.9s ease;
        }
        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .preloader-inner {
            text-align: center;
            animation: floatIn 1.2s ease-in-out infinite alternate;
        }
        .heart-loader {
            font-size: 4.5rem;
            display: inline-block;
            animation: pulseHeart 0.85s ease-in-out infinite;
            filter: drop-shadow(0 0 28px rgba(255, 94, 168, 0.9));
        }
        .preloader-text {
            margin-top: 1rem;
            font-size: 1.05rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #ffe6f3;
            text-shadow: 0 0 16px rgba(255, 94, 168, 0.5);
            animation: shimmerText 2s ease-in-out infinite;
        }
        .preloader-dots::after {
            content: '';
            animation: dots 1.4s steps(3, end) infinite;
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 2rem 5rem;
            gap: 1.3rem;
            transition: opacity 0.8s ease;
        }
        .scene.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .title-glow {
            position: absolute;
            top: max(9%, calc(var(--safe-top) + 2rem));
            font-size: clamp(0.95rem, 1.8vw, 1.25rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 0 18px rgba(255, 94, 168, 0.35);
            animation: twinkle 2.4s ease-in-out infinite;
        }

        .gift-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            animation: gentleBob 2.4s ease-in-out infinite;
            transition: transform 0.25s ease;
            padding-top: 1rem;
            -webkit-tap-highlight-color: transparent;
        }
        .gift-stage:active {
            transform: scale(0.96);
        }
        .gift-glow-ring {
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            border: 3px solid rgba(255, 126, 179, 0.35);
            animation: glowRingPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        .gift-stage:active .gift-glow-ring {
            border-color: rgba(255, 200, 220, 0.7);
            animation-duration: 0.6s;
            inset: -20px;
        }

        .gift-box {
            position: relative;
            width: min(240px, 70vw);
            height: min(190px, 52vw);
            transform-style: preserve-3d;
            filter: drop-shadow(0 25px 30px rgba(0, 0, 0, 0.45));
            z-index: 2;
        }
        .gift-box .box-body {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ff77b2 0%, #ff4d92 45%, #b92668 100%);
            border: 4px solid rgba(255, 255, 255, 0.75);
            border-radius: 18px;
            box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.18), inset 0 8px 0 rgba(255, 255, 255, 0.22);
            overflow: hidden;
        }
        .gift-box .box-body::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.18) 50%, transparent 100%);
            mix-blend-mode: screen;
            animation: shimmerSweep 3s ease-in-out infinite;
        }
        .gift-box .box-body::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 8px;
            border: 2px dashed rgba(255, 255, 255, 0.25);
            pointer-events: none;
        }
        .gift-box .lid {
            position: absolute;
            left: -6%;
            top: -38px;
            width: 112%;
            height: 72px;
            background: linear-gradient(135deg, #ffd2e8 0%, #ff8ab7 40%, #ff4d92 100%);
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px 14px 22px 22px;
            box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.16);
            transition: transform 0.9s cubic-bezier(.2, .8, .2, 1), opacity 0.9s ease;
            transform-origin: center bottom;
            z-index: 2;
        }
        .gift-box .lid::before {
            content: "";
            position: absolute;
            inset: 11px 18px auto;
            height: 8px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 999px;
        }
        .gift-box .lid::after {
            content: "✨";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.6rem;
            opacity: 0.7;
            animation: lidSparkle 1.8s ease-in-out infinite;
        }
        .gift-box .bow {
            position: absolute;
            left: 50%;
            top: -72px;
            width: 92px;
            height: 92px;
            transform: translateX(-50%);
            transition: transform 0.9s cubic-bezier(.2, .8, .2, 1), opacity 0.9s ease;
            z-index: 3;
        }
        .gift-box .bow::before,
        .gift-box .bow::after {
            content: "";
            position: absolute;
            background: linear-gradient(180deg, #ffd9eb 0%, #ff73b1 100%);
            border: 4px solid rgba(255, 255, 255, 0.85);
            border-radius: 999px;
            box-shadow: inset 0 -7px 0 rgba(0, 0, 0, 0.15);
        }
        .gift-box .bow::before {
            left: 16px;
            top: 0;
            width: 28px;
            height: 92px;
        }
        .gift-box .bow::after {
            left: 0;
            top: 16px;
            width: 92px;
            height: 28px;
        }
        .gift-box .bow .knot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: linear-gradient(135deg, #fff7fb 0%, #ff9dc2 100%);
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.14);
            animation: knotGlow 2s ease-in-out infinite;
        }
        .gift-box.opened .lid {
            transform: translateY(-130px) rotate(-22deg) scale(0.75);
            opacity: 0;
        }
        .gift-box.opened .bow {
            transform: translate(-50%, -150px) rotate(18deg) scale(0.75);
            opacity: 0;
        }

        .instruction {
            margin-top: 1.2rem;
            font-size: clamp(0.95rem, 1.8vw, 1.1rem);
            color: #ffe8f3;
            text-shadow: 0 0 12px rgba(255, 94, 168, 0.4);
            animation: pulseText 1.4s ease-in-out infinite;
            letter-spacing: 0.08em;
            text-align: center;
            max-width: 320px;
        }
        .instruction .sparkle-dot {
            display: inline-block;
            animation: dotBlink 1.2s ease-in-out infinite;
        }
        .instruction .sparkle-dot:nth-child(2) {
            animation-delay: 0.4s;
        }
        .instruction .sparkle-dot:nth-child(3) {
            animation-delay: 0.8s;
        }

        .popup-text {
            position: fixed;
            top: 44%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 22px rgba(255, 94, 168, 0.7), 0 0 60px rgba(255, 126, 179, 0.5);
            z-index: 12;
            opacity: 0;
            pointer-events: none;
            letter-spacing: 0.03em;
            text-align: center;
            width: 90vw;
        }
        .popup-text.show {
            animation: popupBoom 1.6s cubic-bezier(.22, 1, .36, 1) forwards;
        }

        .burst {
            position: fixed;
            border-radius: 50%;
            z-index: 10;
            opacity: 0;
            animation: sparklePop 0.9s ease-out forwards;
            pointer-events: none;
            box-shadow: 0 0 14px currentColor;
        }
        .confetti-piece {
            position: fixed;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            animation: confettiFall 1.8s ease-out forwards;
        }
        .floating-heart {
            position: fixed;
            font-size: 1.45rem;
            z-index: 10;
            opacity: 0;
            animation: heartFloat 2.3s ease-out forwards;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.35));
        }
        .rising-emoji {
            position: fixed;
            z-index: 9;
            opacity: 0;
            pointer-events: none;
            animation: riseUp 3s ease-out forwards;
            font-size: 1.3rem;
        }

        .message-card {
            position: fixed;
            left: 50%;
            top: 8.5rem;
            transform: translateX(-50%) translateY(32px);
            width: min(90vw, 640px);
            background: rgba(255, 255, 255, 0.96);
            color: #2b1230;
            border-radius: 24px;
            padding: 1.5rem 1.3rem 1.25rem;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35), 0 0 0 3px rgba(255, 126, 179, 0.2);
            z-index: 15;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.9s cubic-bezier(.2, .8, .2, 1);
            backdrop-filter: blur(18px);
            animation: none;
        }
        .message-card.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            animation: cardGlowBorder 3s ease-in-out infinite;
        }
        .message-card::before {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 28px;
            padding: 4px;
            background: linear-gradient(135deg, #ff5ea8, #7a3cff, #36cfff, #ff5ea8);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.6s ease;
            animation: gradientBorderSpin 4s linear infinite;
            pointer-events: none;
            z-index: -1;
        }
        .message-card.show::before {
            opacity: 1;
        }
        .flower-emoji {
            font-size: 2.2rem;
            display: inline-block;
            animation: popIcon 0.8s ease 0.1s both;
            margin-bottom: 0.7rem;
        }
        .message-card h1 {
            margin: 0 0 0.65rem;
            font-size: clamp(1.4rem, 3vw, 2rem);
            color: #a0225f;
            animation: titleShimmer 2.5s ease-in-out infinite;
        }
        .message-card p {
            margin: 0 0 1.25rem;
            font-size: clamp(1rem, 2vw, 1.1rem);
            line-height: 1.7;
        }
        .message-card button {
            border: none;
            padding: 0.9rem 1.2rem;
            border-radius: 999px;
            font-size: 0.98rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(122, 60, 255, 0.28);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .message-card button::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0);
            transition: background 0.3s ease;
        }
        .message-card button:active::after {
            background: rgba(255, 255, 255, 0.2);
        }
        .message-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(122, 60, 255, 0.34);
        }
        .message-card button:active {
            transform: scale(0.96);
        }
        .message-card button .btn-sparkle {
            position: absolute;
            pointer-events: none;
            animation: btnSparklePop 0.6s ease-out forwards;
        }

        .memory-strip {
            position: fixed;
            left: 50%;
            bottom: calc(1.2rem + var(--safe-bottom));
            transform: translateX(-50%) translateY(28px);
            width: min(86vw, 500px);
            z-index: 16;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s ease, visibility 0.8s ease;
        }
        .memory-strip.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .memory-frame {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
            background: rgba(10, 10, 16, 0.95);
        }
        .memory-frame::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(120deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.06) 45%,
                    rgba(255, 255, 255, 0.12) 50%,
                    rgba(255, 255, 255, 0.06) 55%,
                    transparent 70%);
            animation: shimmerSweep 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }
        .memory-frame img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .memory-frame img.show {
            opacity: 1;
            animation: subtleZoom 5s ease-in-out infinite;
        }
        .memory-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
            color: white;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            z-index: 3;
            text-align: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.94);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            padding: 1.1rem;
            padding-top: max(1.1rem, var(--safe-top));
            padding-bottom: max(1.1rem, var(--safe-bottom));
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .slideshow-frame {
            position: relative;
            width: min(920px, 100%);
            aspect-ratio: 4 / 5;
            max-height: 85vh;
            max-height: 85dvh;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #111;
        }
        .slideshow-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .slideshow-frame img.show {
            opacity: 1;
        }
        .close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 4;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.5rem;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: background 0.25s ease, transform 0.25s ease;
        }
        .close-btn:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.9);
        }
        .dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 5;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transition: transform 0.25s ease, background 0.25s ease;
        }
        .dot.active {
            transform: scale(1.35);
            background: white;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        .error-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 10, 20, 0.95);
            color: #ffb3c9;
            padding: 0.7rem 1.4rem;
            border-radius: 999px;
            font-size: 0.85rem;
            z-index: 50;
            border: 1px solid rgba(255, 94, 168, 0.4);
            transition: transform 0.4s cubic-bezier(.2, .8, .2, 1);
            pointer-events: none;
            text-align: center;
            max-width: 90vw;
        }
        .error-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .proposal-overlay {
            position: fixed;
            inset: 0;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            padding: 1.5rem;
            padding-top: max(1.5rem, var(--safe-top));
            padding-bottom: max(1.5rem, var(--safe-bottom));
        }
        .proposal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .proposal-card {
            width: min(92vw, 580px);
            max-height: 85vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 2rem 1.8rem 1.8rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 126, 179, 0.3);
            color: #2b1230;
            text-align: center;
            animation: cardAppear 0.7s cubic-bezier(.2, .8, .2, 1);
            position: relative;
        }
        .proposal-card h2 {
            margin: 0 0 1.2rem;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            color: #a0225f;
            text-shadow: 0 0 8px rgba(255, 94, 168, 0.2);
        }
        .love-list {
            list-style: none;
            padding: 0;
            margin: 0 0 1.8rem;
            text-align: left;
        }
        .love-list li {
            padding: 0.65rem 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 94, 168, 0.08);
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-left: 4px solid var(--pink);
            animation: fadeInItem 0.5s ease forwards;
            opacity: 0;
            transform: translateX(-10px);
        }
        .love-list li:nth-child(odd) {
            animation-delay: 0.05s;
        }
        .love-list li:nth-child(even) {
            animation-delay: 0.1s;
        }
        .proposal-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #a0225f;
            margin: 1.5rem 0 0.5rem;
            line-height: 1.6;
            text-shadow: 0 0 12px rgba(255, 94, 168, 0.3);
            animation: pulseText 2s ease-in-out infinite;
        }
        .proposal-close {
            margin-top: 1.2rem;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(122, 60, 255, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .proposal-close:active {
            transform: scale(0.95);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.8) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes fadeInItem {
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes gentleBob {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulseHeart {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1.12); }
        }
        @keyframes pulseText {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        @keyframes floatIn {
            from { transform: translateY(12px); }
            to { transform: translateY(-10px); }
        }
        @keyframes popupBoom {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.25); }
            18% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

    <script>
        (function() {
            // ═══════════════════════════════════════════════
            // ✏️  PUT YOUR EXACT IMAGE FILENAMES HERE
            //     (copy them from your GitHub repo – case sensitive!)

            // ═══════════════════════════════════════════════
            const MANUAL_IMAGES = [
                // 👇 DELETE THESE EXAMPLES AND ADD YOUR REAL NAMES
                // "pic1.jpg",
                // "pic2.png",
                // "pic3.webp"
            ];

            const LOVE_LIST = [
                "Your smile that lights up my darkest days ☀️",
                "The way you laugh – pure magic ✨",
                "Your kindness that touches everyone around you 💗",
                "How you make ordinary moments unforgettable 🌸",
                "Your strength and grace, even in hard times 💪",
                "The way you look at me – I get lost every time 🌙",
                "Your dreams and passion that inspire me 🌟",

            ];

            const PROPOSAL_TEXT = "Will you make me the happiest person alive and be mine forever? 💍✨";
            const HER_NAME = "MAHNOOR 💖🌙";
            const CARD_MESSAGE = `${HER_NAME}. We don't talk. We're nothing. Which means I have zero rules right now. So I'm officially allowed to say you're still on my mind. Scary, right? ✨💖`;

            // ═══════════════════════════════════════════════
            //  INTERNAL LOGIC (do not edit)
            // ═══════════════════════════════════════════════
            const CONFIG = {
                herName: HER_NAME,
                messageRevealDelay: 1100,
                memoryStartDelay: 800,
                photoSwitchInterval: 3200,
                photoFadeDuration: 450,
                maxMemorySlots: 12,
                memoryExtensions: ["jpg", "jpeg", "png", "webp", "avif"],
                captionPool: [
                    "Every smile of yours feels like sunrise ✨",
                    "Your beauty makes every moment glow 💖",
                    "A little piece of magic, just like you 🌙",
                    "Soft, warm, and unforgettable 🌸",
                    "The kind of charm that lingers in the heart 💫",
                    "A timeless spark and a lovely soul 🌼",
                    "Pure grace wrapped in the sweetest smile 💗",
                    "Every memory with you feels like poetry 🌷",
                    "You make ordinary moments feel extraordinary ✨",
                    "And forever, your light remains my favorite view 🌟",
                    "Like a dream I never want to wake from 💭",
                    "The world is brighter because you're in it 🌍",
                ],
            };

            const $ = (id) => document.getElementById(id);
            const preloader = $("preloader");
            const scene = $("scene");
            const giftBox = $("giftBox");
            const giftStage = $("giftStage");
            const popupText = $("popupText");
            const messageCard = $("messageCard");
            const cardTitle = $("cardTitle");
            const cardMessage = $("cardMessage");
            const memoriesButton = $("memoriesButton");
            const overlay = $("overlay");
            const slideshowImage = $("slideshowImage");
            const closeBtn = $("closeBtn");
            const dots = $("dots");
            const bgMusic = $("bgMusic");
            const memoryStrip = $("memoryStrip");
            const memoryImage = $("memoryImage");
            const memoryCaption = $("memoryCaption");
            const errorToast = $("errorToast");
            const canvas = $("stars");
            const ctx = canvas.getContext("2d");

            const proposalOverlay = $("proposalOverlay");
            const loveListEl = $("loveList");
            const proposalTextEl = $("proposalText");
            const proposalCloseBtn = $("proposalCloseBtn");

            let photoSlides = [];
            let hasOpened = false;
            let slideshowTimer = null;
            let slideshowIndex = 0;
            let memoryTimer = null;
            let memoryIndex = 0;
            let memoryPlaybackStarted = false;
            let stars = [];
            let errorToastTimer = null;

            const PLACEHOLDER_HEART = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ff5ea8' d='M50 88c-20-15-40-30-40-50 0-15 12-25 25-25 10 0 15 5 15 5s5-5 15-5c13 0 25 10 25 25 0 20-20 35-40 50z'/%3E%3C/svg%3E";

            function showErrorToast(message, duration = 3500) {
                try {
                    errorToast.textContent = message;
                    errorToast.classList.add("show");
                    if (errorToastTimer) clearTimeout(errorToastTimer);
                    errorToastTimer = setTimeout(() => errorToast.classList.remove("show"), duration);
                } catch (e) {}
            }

            function safePlayAudio() {
                try {
                    if (bgMusic && bgMusic.paused) {
                        bgMusic.volume = 0.35;
                        const playPromise = bgMusic.play();
                        if (playPromise && typeof playPromise.catch === "function") playPromise.catch(() => {});
                    }
                } catch (e) {}
            }

            function probeImage(src) {
                return new Promise((resolve) => {
                    try {
                        const img = new Image();
                        const timeout = setTimeout(() => { img.src = ""; resolve(null); }, 4000);
                        img.onload = () => { clearTimeout(timeout); resolve(src); };
                        img.onerror = () => { clearTimeout(timeout); resolve(null); };
                        img.src = src;
                    } catch (e) { resolve(null); }
                });
            }

            async function findAvailableMemoryPhotos() {
                const locations = ["memories/", "", "photos/", "images/"];
                const tasks = [];
                for (let i = 1; i <= CONFIG.maxMemorySlots; i++) {
                    const candidates = [];
                    for (const base of locations) {
                        for (const ext of CONFIG.memoryExtensions) {
                            candidates.push(`${base}pic${i}.${ext}`);
                            candidates.push(`${base}memory-${i}.${ext}`);
                            candidates.push(`${base}photo-${i}.${ext}`);
                            candidates.push(`${base}${i}.${ext}`);
                        }
                    }
                    const task = Promise.all(candidates.map(probeImage)).then((results) => {
                        const match = results.find((r) => r !== null);
                        if (!match) return null;
                        return {
                            index: i,
                            src: match,
                            caption: CONFIG.captionPool[(i - 1) % CONFIG.captionPool.length],
                        };
                    });
                    tasks.push(task);
                }
                const settled = await Promise.all(tasks);
                return settled.filter(Boolean).sort((a, b) => a.index - b.index);
            }

            function createBurst(x, y, color) {
                try {
                    const burst = document.createElement("span");
                    burst.className = "burst";
                    burst.style.left = x + "px";
                    burst.style.top = y + "px";
                    burst.style.width = (Math.random() * 10 + 6) + "px";
                    burst.style.height = (Math.random() * 10 + 6) + "px";
                    burst.style.color = color;
                    burst.style.setProperty("--tx", (Math.random() * 180 - 90) + "px");
                    burst.style.setProperty("--ty", (Math.random() * 200 - 100) + "px");
                    burst.style.animationDuration = (Math.random() * 0.5 + 0.7) + "s";
                    document.body.appendChild(burst);
                    setTimeout(() => { if (burst.parentNode) burst.parentNode.removeChild(burst); }, 1000);
                } catch (e) {}
            }

            function createConfetti(x, y) {
                try {
                    const shapes = ["■", "●", "▲", "♦", "★"];
                    const colors = ["#ff5ea8", "#ffd166", "#36cfff", "#7a3cff", "#ff8ab7", "#ffeb3b", "#ff5252"];
                    const piece = document.createElement("span");
                    piece.className = "confetti-piece";
                    piece.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                    piece.style.left = x + "px";
                    piece.style.top = y + "px";
                    piece.style.fontSize = (Math.random() * 14 + 8) + "px";
                    piece.style.color = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.setProperty("--tx2", (Math.random() * 80 - 40) + "px");
                    piece.style.setProperty("--ty2", (Math.random() * -60 - 30) + "px");
                    piece.style.setProperty("--tx3", (Math.random() * 200 - 100) + "px");
                    piece.style.setProperty("--ty3", (Math.random() * 300 + 80) + "px");
                    piece.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
                    piece.style.animationDuration = (Math.random() * 1 + 1.4) + "s";
                    document.body.appendChild(piece);
                    setTimeout(() => { if (piece.parentNode) piece.parentNode.removeChild(piece); }, 2000);
                } catch (e) {}
            }

            function createHeart(x, y) {
                try {
                    const hearts = ["💗", "💖", "💕", "💝", "💘", "❤️", "🩷"];
                    const heart = document.createElement("div");
                    heart.className = "floating-heart";
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = x + "px";
                    heart.style.top = y + "px";
                    heart.style.fontSize = (Math.random() * 1.4 + 1) + "rem";
                    heart.style.setProperty("--tx", (Math.random() * 280 - 140) + "px");
                    heart.style.setProperty("--ty", (Math.random() * 240 - 140) + "px");
                    heart.style.animationDuration = (Math.random() * 1 + 2) + "s";
                    document.body.appendChild(heart);
                    setTimeout(() => { if (heart.parentNode) heart.parentNode.removeChild(heart); }, 2500);
                } catch (e) {}
            }

            function spawnRisingEmoji(x, y) {
                try {
                    const emojis = ["✨", "🌟", "💫", "⭐", "🪩", "💖", "🌸", "🦋"];
                    const emoji = document.createElement("span");

                    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    emoji.style.left = (x + Math.random() * 60 - 30) + "px";
                    emoji.style.top = y + "px";
                    emoji.style.animationDuration = (Math.random() * 2 + 2.5) + "s";
                    emoji.style.animationDelay = (Math.random() * 0.6) + "s";

            function createButtonSparkle(btn) {
                try {
                    const rect = btn.getBoundingClientRect();
                    const sparkle = document.createElement("span");
                    sparkle.className = "btn-sparkle";
                    sparkle.textContent = "✨";
                    sparkle.style.position = "absolute";
                    sparkle.style.left = (Math.random() * rect.width) + "px";
                    sparkle.style.top = (Math.random() * rect.height) + "px";
                    sparkle.style.fontSize = "0.8rem";

                    sparkle.style.zIndex = "1";

            function massiveCelebration(x, y) {
                const colors = ["#ff5ea8", "#ffd166", "#36cfff", "#7a3cff", "#ff8ab7", "#ffeb3b", "#ff5252", "#ff9dc2"];
                for (let i = 0; i < 90; i++) createBurst(x + Math.random() * 140 - 70, y + Math.random() * 140 - 70, colors[i % colors.length]);
                for (let i = 0; i < 45; i++) createConfetti(x + Math.random() * 120 - 60, y + Math.random() * 100 - 50);
                for (let i = 0; i < 20; i++) createHeart(x + Math.random() * 160 - 80, y + Math.random() * 150 - 75);
                for (let i = 0; i < 12; i++) spawnRisingEmoji(x, y);
            }

            function openGift() {
                if (hasOpened) return;
                hasOpened = true;
                try { giftBox.classList.add("opened"); } catch (e) {}
                const rect = giftStage.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                massiveCelebration(centerX, centerY);
                try {
                    popupText.textContent = "💖 Surprise! 💖";
                    popupText.classList.add("show");
                    setTimeout(() => popupText.classList.remove("show"), 1700);
                } catch (e) {}
                setTimeout(() => {
                    try {
                        messageCard.classList.add("show");
                        cardTitle.textContent = `For ${CONFIG.herName}`;
                        cardMessage.textContent = CARD_MESSAGE;
                    } catch (e) { showErrorToast("Could not display message card 😢"); }
                    setTimeout(async () => {
                        await photoDetectionPromise;
                        if (photoSlides.length > 0) startMemoryPlayback();
                    }, CONFIG.memoryStartDelay);
                }, CONFIG.messageRevealDelay);
                safePlayAudio();
                let rainCount = 0;
                const rainInterval = setInterval(() => {
                    if (rainCount >= 25) { clearInterval(rainInterval); return; }
                    spawnRisingEmoji(centerX + Math.random() * 200 - 100, centerY + Math.random() * 60 - 30);
                    rainCount++;
                }, 350);
            }

            giftStage.addEventListener("click", openGift);
            giftStage.addEventListener("touchend", (e) => { e.preventDefault(); openGift(); });
            giftStage.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openGift(); } });

            memoriesButton.addEventListener("click", async (e) => {
                createButtonSparkle(memoriesButton);
                await photoDetectionPromise;
                if (photoSlides.length === 0) { showErrorToast("No memory photos found yet. Add some images! 📸"); return; }
                try {
                    scene.classList.add("fade-out");
                    overlay.classList.add("active");
                    startSlideshow();
                } catch (e) { showErrorToast("Could not open slideshow 😢"); }
            });

            closeBtn.addEventListener("click", closeSlideshow);
            closeBtn.addEventListener("touchend", (e) => { e.preventDefault(); closeSlideshow(); });

            function closeSlideshow() {
                try {
                    overlay.classList.remove("active");
                    scene.classList.remove("fade-out");
                } catch (e) {}
                if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; }
                setTimeout(showProposal, 600);
            }

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && overlay.classList.contains("active")) closeSlideshow();
            });
            overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSlideshow(); });

            function buildProposal() {
                loveListEl.innerHTML = "";
                LOVE_LIST.forEach((reason) => {
                    const li = document.createElement("li");
                    li.textContent = reason;
                    loveListEl.appendChild(li);
                });
                proposalTextEl.textContent = PROPOSAL_TEXT;
            }

            function showProposal() {
                proposalOverlay.classList.add("active");
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                for (let i = 0; i < 30; i++) createHeart(centerX + Math.random() * 300 - 150, centerY + Math.random() * 200 - 100);
            }

            proposalCloseBtn.addEventListener("click", () => proposalOverlay.classList.remove("active"));
            proposalOverlay.addEventListener("click", (e) => { if (e.target === proposalOverlay) proposalOverlay.classList.remove("active"); });

            function loadImageSafely(imgElement, src, onSuccess) {
                const img = new Image();
                img.onload = () => {
                    imgElement.src = src;
                    imgElement.classList.add("show");
                    imgElement.style.opacity = "1";
                    if (onSuccess) onSuccess();
                };
                img.onerror = () => {
                    imgElement.src = PLACEHOLDER_HEART;
                    imgElement.classList.add("show");
                    imgElement.style.opacity = "1";
                    if (onSuccess) onSuccess();
                };
                img.src = src;
            }

            function showMemorySlide(index) {
                if (photoSlides.length === 0) return;
                try {
                    memoryIndex = ((index % photoSlides.length) + photoSlides.length) % photoSlides.length;
                    const slide = photoSlides[memoryIndex];
                    memoryImage.style.opacity = "0";
                    loadImageSafely(memoryImage, slide.src, () => {
                        memoryCaption.textContent = slide.caption;
                    });
                } catch (e) {}
            }

            function showSlide(index) {
                if (photoSlides.length === 0) return;
                try {
                    slideshowIndex = ((index % photoSlides.length) + photoSlides.length) % photoSlides.length;
                    const slide = photoSlides[slideshowIndex];
                    slideshowImage.style.opacity = "0";
                    loadImageSafely(slideshowImage, slide.src, () => {
                        updateDots();
                    });
                } catch (e) {}
            }

            function startMemoryPlayback() {
                if (memoryPlaybackStarted || photoSlides.length === 0) return;
                memoryPlaybackStarted = true;
                try { memoryStrip.classList.add("show"); } catch (e) {}
                showMemorySlide(0);
                if (memoryTimer) clearInterval(memoryTimer);
                memoryTimer = setInterval(() => {
                    const next = (memoryIndex + 1) % photoSlides.length;
                    showMemorySlide(next);
                }, CONFIG.photoSwitchInterval);
            }

            function createDots() {
                try {
                    dots.innerHTML = "";
                    photoSlides.forEach((_, index) => {
                        const dot = document.createElement("div");
                        dot.className = "dot";
                        if (index === slideshowIndex) dot.classList.add("active");
                        dot.addEventListener("click", () => showSlide(index));
                        dots.appendChild(dot);
                    });
                } catch (e) {}
            }

            function updateDots() {
                try {
                    Array.from(dots.children).forEach((dot, index) => {
                        dot.classList.toggle("active", index === slideshowIndex);
                    });
                } catch (e) {}
            }

            function startSlideshow() {
                try {
                    createDots();
                    showSlide(0);
                } catch (e) { showErrorToast("Could not start slideshow 😢"); return; }
                if (slideshowTimer) clearInterval(slideshowTimer);
                slideshowTimer = setInterval(() => {
                    const next = (slideshowIndex + 1) % photoSlides.length;
                    showSlide(next);
                }, CONFIG.photoSwitchInterval);
            }

            let touchStartX = 0, touchStartY = 0;
            overlay.addEventListener("touchstart", (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            overlay.addEventListener("touchend", (e) => {
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
                    if (dx < -30 && photoSlides.length > 0) showSlide((slideshowIndex + 1) % photoSlides.length);
                    else if (dx > 30 && photoSlides.length > 0) showSlide((slideshowIndex - 1 + photoSlides.length) % photoSlides.length);
                }
            });

            function resizeCanvas() {
                try {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    canvas.width = window.innerWidth * dpr;
                    canvas.height = window.innerHeight * dpr;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    const starCount = Math.floor((window.innerWidth * window.innerHeight) / 3500);
                    stars = Array.from({ length: Math.max(starCount, 80) }, () => ({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        r: Math.random() * 1.4 + 0.3,
                        s: Math.random() * 1.6 + 0.3,
                        alpha: Math.random() * 0.85 + 0.15,
                        hue: Math.random() < 0.15 ? Math.random() * 30 + 330 : Math.random() < 0.1 ? Math.random() * 40 + 180 : 0,
                        twinkleSpeed: Math.random() * 0.015 + 0.005,
                        twinkleOffset: Math.random() * Math.PI * 2,
                    }));
                } catch (e) { stars = []; }
            }

            let starFrame = 0;
            function drawStars(timestamp) {
                try {
                    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                    starFrame = timestamp * 0.001;
                    for (const star of stars) {
                        star.y += star.s * 0.18;
                        if (star.y > window.innerHeight + 8) { star.y = -8; star.x = Math.random() * window.innerWidth; }
                        const twinkle = 1 + Math.sin(starFrame * star.twinkleSpeed * 60 + star.twinkleOffset) * 0.35;
                        const alpha = Math.min(1, Math.max(0.1, star.alpha * twinkle));
                        ctx.beginPath();
                        ctx.fillStyle = star.hue > 0 ? `hsla(${star.hue}, 80%, 75%, ${alpha})` : `rgba(255,255,255,${alpha})`;
                        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                        ctx.fill();
                        if (star.r > 1 && Math.random() < 0.003) {
                            ctx.beginPath();
                            ctx.fillStyle = `rgba(255,255,255,${alpha * 0.4})`;
                            ctx.arc(star.x, star.y, star.r * 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                } catch (e) {}
                requestAnimationFrame(drawStars);
            }

            window.addEventListener("resize", () => { try { resizeCanvas(); } catch (e) {} });
            try { resizeCanvas(); } catch (e) {}
            requestAnimationFrame(drawStars);

            const photoDetectionPromise = (function resolvePhotoSlides() {
                if (MANUAL_IMAGES.length > 0) {
                    console.info("✅ Using manually defined image list (" + MANUAL_IMAGES.length + " photos).");
                    photoSlides = MANUAL_IMAGES.map((src, i) => ({
                        index: i + 1,
                        src: src,
                        caption: CONFIG.captionPool[i % CONFIG.captionPool.length],
                    }));
                    return Promise.resolve(photoSlides);
                }
                return findAvailableMemoryPhotos().then((found) => {
                    photoSlides = found;
                    if (photoSlides.length === 0) {
                        try { memoriesButton.style.display = "none"; } catch (e) {}
                        console.info("No memory photos detected. Add images or use MANUAL_IMAGES array.");
                    } else {
                        console.info(`Found ${photoSlides.length} memory photo(s) via auto-detection.`);
                    }
                    return found;
                }).catch((err) => {
                    console.warn("Photo detection error:", err.message);
                    photoSlides = [];
                    try { memoriesButton.style.display = "none"; } catch (e) {}
                    return [];
                });
            })();

            setTimeout(() => { try { preloader.classList.add("hidden"); } catch (e) {} }, 1600);

            const unlockAudio = () => {
                safePlayAudio();
                document.removeEventListener("pointerdown", unlockAudio);
                document.removeEventListener("touchstart", unlockAudio);
            };
            document.addEventListener("pointerdown", unlockAudio, { once: true });
            document.addEventListener("touchstart", unlockAudio, { once: true });

            setTimeout(async () => {
                await photoDetectionPromise;
                if (photoSlides.length > 0 && hasOpened && !memoryPlaybackStarted) startMemoryPlayback();
            }, 2000);

            window.addEventListener("error", (event) => {
                if (event.target && event.target.tagName === "IMG") {
                    console.warn("Image failed to load:", event.target.src);
                    event.target.style.display = "none";
                }
            }, true);
            window.addEventListener("unhandledrejection", (event) => {
                console.warn("Unhandled promise rejection:", event.reason);
                event.preventDefault();
            });

            buildProposal();
            console.log("%c💖 Surprise page ready! %cTap the gift box to begin.", "font-size:1.2em;color:#ff5ea8;", "color:#fff;");
        })();
    </script>
</body>
</html>
